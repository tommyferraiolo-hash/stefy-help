<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Help Desk Stefania 🎧</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to bottom right, #eceff1, #b0bec5);
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: auto;
      background: white;
      border-radius: 25px;
      padding: 30px;
      box-shadow: 0 0 20px rgba(0,0,0,0.15);
    }

    h1 {
      text-align: center;
      color: #37474f;
      margin-bottom: 5px;
    }

    h3 {
      text-align: center;
      color: #78909c;
      margin-top: 0;
      margin-bottom: 30px;
      font-style: italic;
    }

    .section {
      background: #f5f5f5;
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 25px;
    }

    label {
      font-weight: bold;
      display: block;
      margin-bottom: 8px;
      color: #455a64;
    }

    input[type="text"], textarea, select {
      width: 100%;
      padding: 12px;
      border: 2px solid #b0bec5;
      border-radius: 12px;
      font-size: 16px;
      box-sizing: border-box;
      margin-bottom: 15px;
      background: white;
    }

    button {
      width: 100%;
      padding: 15px;
      font-size: 18px;
      font-weight: bold;
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      background-color: #00838f;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    button:active {
      transform: scale(0.98);
    }

    /* Stili per i Ticket */
    .ticket-list {
      margin-top: 25px;
    }

    .ticket-card {
      border-radius: 15px;
      padding: 15px;
      margin-bottom: 15px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-left: 10px solid #ccc;
    }

    /* Colori Codici Emergenza */
    .code-white { background-color: #ffffff; border: 1px solid #ddd; border-left: 10px solid #e0e0e0; color: #333; }
    .code-green { background-color: #e8f5e9; border-left: 10px solid #4caf50; color: #2e7d32; }
    .code-yellow { background-color: #fffde7; border-left: 10px solid #fbc02d; color: #f57f17; }
    .code-red { background-color: #ffebee; border-left: 10px solid #f44336; color: #c62828; font-weight: bold; }

    .ticket-info {
      flex-grow: 1;
      padding-right: 15px;
    }

    .ticket-title {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .ticket-desc {
      font-size: 15px;
      color: #555;
    }

    .ticket-meta {
      font-size: 12px;
      margin-top: 5px;
      opacity: 0.8;
    }

    .done-btn {
      width: auto;
      padding: 8px 15px;
      font-size: 14px;
      background-color: #37474f;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>SOS Stefania 🎧</h1>
    <h3>Centro Assistenza Colleghe Disperate</h3>

    <div class="section">
      <label>Chi chiede aiuto?</label>
      <input type="text" id="requesterName" placeholder="Il tuo nome...">

      <label>Qual è il problema?</label>
      <textarea id="problemDesc" rows="3" placeholder="Descrivi il dramma in ufficio..."></textarea>

      <label>Livello di Emergenza (Triage)</label>
      <select id="urgencyCode">
        <option value="code-white">⚪ Codice Bianco (Roba da niente)</option>
        <option value="code-green" selected>🟢 Codice Verde (Con calma)</option>
        <option value="code-yellow">🟡 Codice Giallo (Urgente / Aiuto)</option>
        <option value="code-red">🔴 Codice Rosso (Disastro Totale!)</option>
      </select>
      
      <button onclick="openTicket()" ontouchstart="">Invia Ticket a Stefania 🚀</button>
    </div>

    <div class="ticket-list">
      <label style="font-size: 18px; border-bottom: 2px solid #cfd8dc; padding-bottom: 5px;">
        📥 Ticket in Attesa di Gestione
      </label>
      <div id="ticketsContainer" style="margin-top: 15px;">
        </div>
    </div>
  </div>

  <script>
    let tickets = [];

    window.onload = function() {
      if (localStorage.getItem("helpdesk_tickets")) {
        tickets = JSON.parse(localStorage.getItem("helpdesk_tickets"));
      }
      renderTickets();
    };

    function openTicket() {
      let nameField = document.getElementById("requesterName");
      let descField = document.getElementById("problemDesc");
      let codeField = document.getElementById("urgencyCode");

      if (!nameField.value.trim() || !descField.value.trim()) {
        alert("Scrivi chi sei e descrivi il problema prima di chiamare Stefania!");
        return;
      }

      // Crea l'oggetto ticket
      let newTicket = {
        id: Date.now(),
        user: nameField.value,
        desc: descField.value,
        code: codeField.value,
        time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
      };

      tickets.push(newTicket);
      localStorage.setItem("helpdesk_tickets", JSON.stringify(tickets));
      
      // Svuota i campi
      descField.value = "";
      renderTickets();
    }

    function resolveTicket(id) {
      tickets = tickets.filter(t => t.id !== id);
      localStorage.setItem("helpdesk_tickets", JSON.stringify(tickets));
      renderTickets();
    }

    function renderTickets() {
      let container = document.getElementById("ticketsContainer");
      container.innerHTML = "";

      if (tickets.length === 0) {
        container.innerHTML = "<p style='text-align:center; color:#78909c; font-style:italic;'>Tutto tranquillo. Stefania ha risolto tutto! 🧘‍♀️✨</p>";
        return;
      }

      // Mostra i ticket partendo dai più recenti o più gravi
      tickets.forEach(t => {
        let card = document.createElement("div");
        card.className = `ticket-card ${t.code}`;
        
        let labelUrgenza = "";
        if(t.code === "code-white") labelUrgenza = "BIANCO";
        if(t.code === "code-green") labelUrgenza = "VERDE";
        if(t.code === "code-yellow") labelUrgenza = "GIALLO";
        if(t.code === "code-red") labelUrgenza = "ROSSO 🔥";

        card.innerHTML = `
          <div class="ticket-info">
            <div class="ticket-title">${t.user} [Codice ${labelUrgenza}]</div>
            <div class="ticket-desc">"${t.desc}"</div>
            <div class="ticket-meta">Inviato alle ore: ${t.time}</div>
          </div>
          <button class="done-btn" onclick="resolveTicket(${t.id})" ontouchstart="">Risolto ✅</button>
        `;
        container.appendChild(card);
      });
    }
  </script>

</body>
</html>
